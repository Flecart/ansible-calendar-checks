---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - python3
      - python3-pip
      - python3-venv
      - curl
      - acl
    state: present
  become: true

- name: Install Node.js LTS via NodeSource
  ansible.builtin.shell: |
    curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
    apt-get install -y nodejs
  args:
    creates: /usr/bin/node
  become: true
